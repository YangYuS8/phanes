stages:
  - test
  - build
  - package
  - release
  - deploy

go:test:
  stage: test
  image: golang:1.22
  script:
    - go test ./...

proto:lint:
  stage: test
  image: node:20
  script:
    - npm exec --yes --package=@bufbuild/buf -- buf lint

docs:build:
  stage: test
  image: node:20
  script:
    - npm ci
    - npm run build
    - npm run build:en
    - npm run build:zh

release:build:windows:
  stage: build
  image: golang:1.22
  parallel:
    matrix:
      - GOOS: windows
        GOARCH: amd64
      - GOOS: windows
        GOARCH: arm64
  script:
    - mkdir -p dist
    - go build -trimpath -ldflags "-s -w -X main.version=${CI_COMMIT_TAG:-dev} -X main.commit=${CI_COMMIT_SHA}" -o "dist/phanes-${GOOS}-${GOARCH}.exe" ./cmd/phanes
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

release:package:windows:
  stage: package
  image: alpine:3.20
  needs:
    - job: release:build:windows
      artifacts: true
  before_script:
    - apk add --no-cache zip
  script:
    - |
      set -eu
      mkdir -p release
      for exe in dist/phanes-windows-*.exe; do
        base="$(basename "$exe" .exe)"
        zip -j "release/${base}.zip" "$exe" LICENSE NOTICE README.md README.zh-CN.md
      done
      cd release
      sha256sum *.zip > SHA256SUMS.txt
  artifacts:
    paths:
      - release/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

release:create:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: release:package:windows
      artifacts: true
  script:
    - echo "Creating GitLab release ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Phanes $CI_COMMIT_TAG"
    description: "Windows-focused Phanes release for $CI_COMMIT_TAG. Download packaged Windows binaries and verify them with SHA256SUMS.txt."
    assets:
      links:
        - name: "phanes-windows-amd64.zip"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/release/phanes-windows-amd64.zip?job=release:package:windows"
        - name: "phanes-windows-arm64.zip"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/release/phanes-windows-arm64.zip?job=release:package:windows"
        - name: "SHA256SUMS.txt"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/release/SHA256SUMS.txt?job=release:package:windows"
  rules:
    - if: $CI_COMMIT_TAG

pages:
  stage: deploy
  image: node:20
  script:
    - npm ci
    - npm run build
    - mv build public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
